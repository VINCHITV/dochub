[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Suppress verbose asyncio warnings in test output
filterwarnings =
    ignore::DeprecationWarning:chromadb.*
    ignore::DeprecationWarning:llama_index.*
    ignore::PendingDeprecationWarning
